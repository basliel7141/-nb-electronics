
<main id="customerArea" class="hidden">
  <h1>NB ELECTRONICS STORE</h1>

  <div class="nav">
    <button class="active" data-customer-tab="store">PRODUCTS</button>
    <button data-customer-tab="mytickets">MY TICKETS</button>
    <button data-customer-tab="myrequests">MY REQUESTS</button>
  </div>

  <section id="customer-store">
    <div id="customerProducts" class="customer-products">
      <p class="muted">Loading products...</p>
    </div>
  </section>

  <section id="customer-mytickets" class="hidden panel">
    <h2>My Tickets</h2>
    <p class="muted">Your approved ticket information will appear here.</p>
    <div id="myTicketsList"></div>
  </section>

  <section id="customer-myrequests" class="hidden panel">
    <h2>My Requests</h2>
    <div id="myRequestsList"></div>
  </section>

  <section id="ticketPurchase" class="hidden panel">
    <button class="secondary small" id="backToProducts">← BACK TO PRODUCTS</button>
    <h2 id="purchaseProductTitle">Choose Your Tickets</h2>
    <p class="muted" id="purchaseProductInfo"></p>

    <div class="ticket-summary">
      Selected: <strong id="selectedCount">0</strong> / 20
      <br>
      Total: <strong id="selectedTotal">0.00</strong>
    </div>

    <div id="customerTicketGrid" class="customer-ticket-grid"></div>

    <form id="customerPurchaseForm">
      <h2>Customer Information</h2>
      <label>Full Name</label>
      <input id="purchaseFullName" required>

      <label>Phone Number</label>
      <input id="purchasePhone" type="tel" required>

      <h2>Payment Information</h2>
      <div id="customerPaymentInfo" class="payment-info">
        Loading payment details...
      </div>

      <label>Payment Confirmation Text</label>
      <input id="purchasePaymentMessage" required>

      <label>Upload Payment Proof</label>
      <input id="purchaseProof" type="file" accept="image/*" required>

      <button class="primary full" id="submitPurchase">
        SUBMIT PAYMENT REQUEST
      </button>
      <div id="purchaseMessage" class="message"></div>
    </form>
  </section>
</main>
